name: Infrastructure deploy

# Deploys the four CDK stacks in dependency order: web (S3 + CloudFront), data (DynamoDB + SQS),
# lambdas, api (API Gateway). See docs/infrastructure.md.
# Lambda code-only changes are deployed faster by lambda-deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-deploy.yml'
  pull_request:
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infra-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  NODE_VERSION: '22'

jobs:
  check:
    name: Type-check and synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Synthesize
        run: npx cdk synth --quiet

  deploy:
    name: Deploy to AWS
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Shared with lambda-deploy.yml so the two never update the functions at the same time.
    concurrency:
      group: aws-backend-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # needed to request the OIDC token for AWS
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy stacks
        # CDK deploys them in dependency order (web, data, lambdas, api) and skips unchanged ones.
        run: npx cdk deploy WebStack DataStack LambdaStack ApiStack --require-approval never --outputs-file cdk-outputs.json

      - name: Stack outputs
        run: |
          {
            echo '## Stack outputs'
            echo '```json'
            cat cdk-outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
