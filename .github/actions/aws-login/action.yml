name: AWS login
description: >
  Assumes the GitHub deploy role with OpenID Connect (no stored AWS keys).
  The calling job needs `permissions: id-token: write`, and must run on main:
  the role only trusts tokens issued for main.
inputs:
  role-arn:
    description: ARN of the deploy role (secret AWS_DEPLOY_ROLE_ARN)
    required: true
  region:
    description: AWS region
    required: true
runs:
  using: composite
  steps:
    - name: Check the role secret
      shell: bash
      env:
        ROLE_ARN: ${{ inputs.role-arn }}
      run: |
        if [ -z "$ROLE_ARN" ]; then
          echo "::error::Repository secret AWS_DEPLOY_ROLE_ARN is not set (output DeployRoleArn of the Infra / Bootstrap workflow)."
          exit 1
        fi

    - uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}
